name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned app
        run: flutter build ios --release --no-codesign

      # `flutter build ipa --no-codesign` only produces an .xcarchive - the
      # export step needs a signing identity - so the .app is packaged by hand.
      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry income_outcome-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: income-outcome-ios-unsigned
          path: build/ios/iphoneos/income_outcome-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
